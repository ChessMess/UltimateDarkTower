<!doctype html>
<!--
  Source for docs/pages/media/thumbs/codex.jpg — the Tower Codex card's thumbnail.

  Unlike the other thumbs, this one is drawn rather than captured, so it keeps its source. To
  regenerate, serve the REPO ROOT (the asset paths below reach up out of scripts/) and shoot the
  page at exactly 800x500:

    python3 -m http.server 8899
    # → http://localhost:8899/scripts/pages/codex-thumb.html, viewport 800x500, screenshot
    sips -s format jpeg -s formatOptions 82 shot.png --out docs/pages/media/thumbs/codex.jpg

  Three things the landing card does to this image, all easy to forget while editing:
    • it is drawn into a 16/10 box with `object-fit: cover` — any other ratio gets cropped;
    • `.tint` darkens the bottom of the frame, so nothing important goes low;
    • the status ribbon sits over the bottom-right corner.

  No wordmark on purpose: the card prints "Tower Codex" as an <h3> directly beneath it, and no
  sibling thumb carries text.

  The glyph is `quest` — the scroll of the five drum glyphs, and the one the card's own badge uses.
  Keep the two the same: the badge is rendered from `glyph:` in landing.data.mjs, so changing that
  field without re-rendering this file leaves a card whose badge and thumbnail disagree.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>codex thumbnail source</title>
    <style>
      :root {
        --gold: #c9a227;
        --gold-bright: #ecca6b;
      }

      * {
        margin: 0;
        padding: 0;
      }

      body {
        width: 800px;
        height: 500px;
        overflow: hidden;
      }

      .tile {
        position: relative;
        display: grid;
        place-items: center;
        width: 800px;
        height: 500px;
        overflow: hidden;
        background: #0c0a13;
      }

      /* The hero photo, already shipped and already loaded by the page (styles.css:149), so this
         thumbnail adds no new source art. Its own element rather than a background layer on .tile,
         because it wants a filter and the overlays above it must not inherit it. Framed so the
         tower stands centre with the board sweeping out either side — the tower alone is the hero's
         shot, the board is what a *codex* is a reference to. */
      .photo {
        position: absolute;
        inset: 0;
        /* 128% / 90% 4% is not arbitrary. The tower stands at x≈59% of the source photo, so the
           frame must be scaled up before there is enough horizontal slack to pull it under the
           glyph at all — below ~121% it cannot reach centre no matter the offset. Past ~140% it
           reaches, but the board crops away and the plate becomes an anonymous dark tower. 4% on
           the vertical keeps the tower's crown inside the frame. */
        background: url('../../docs/pages/media/background.jpg') 90% 4% / 128% auto no-repeat;
        filter: contrast(1.12) saturate(1.14) brightness(0.86);
      }

      /* Knock the photo back so it reads as a backdrop, not the subject. Warm-dark rather than the
         violet the page's tile gradient uses — at the coverage a thumbnail needs, that violet turns
         the whole plate purple and the board stops looking like a photograph. */
      .scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(58% 62% at 50% 44%, rgba(201, 162, 39, 0.13), transparent 68%),
          linear-gradient(168deg, rgba(12, 9, 18, 0.5), rgba(8, 6, 13, 0.8));
      }

      /* The two texture layers from .card-media.tile, so a drawn thumb still reads as part of the
         same family as the four cards that fall back to that tile. */
      .tile::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 120% at 50% 0%, rgba(123, 92, 255, 0.12), transparent 58%),
          repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.016) 0 12px, transparent 12px 24px);
      }

      /* Vignette — pulls the eye to the glyph and keeps the plate off the card's edges. */
      .tile::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          72% 88% at 50% 44%,
          transparent 28%,
          rgba(8, 6, 13, 0.5) 72%,
          rgba(8, 6, 13, 0.88) 100%
        );
      }

      .emblem {
        position: relative;
        display: grid;
        place-items: center;
        width: 300px;
        height: 300px;
        /* Sits above centre: the card's .tint gradient darkens the bottom of the frame and the
           status ribbon lands in the bottom-right corner. */
        margin-bottom: 26px;
        z-index: 1;
      }

      /* The hero emblem's halo + track, scaled to the thumbnail. */
      .halo {
        position: absolute;
        inset: 2%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(201, 162, 39, 0.3),
          rgba(123, 92, 255, 0.14) 46%,
          transparent 70%
        );
        filter: blur(16px);
      }

      .track {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(201, 162, 39, 0.42);
        box-shadow:
          inset 0 0 46px rgba(123, 92, 255, 0.12),
          0 0 40px rgba(0, 0, 0, 0.5);
      }

      .track.inner {
        inset: 12%;
        border-color: rgba(201, 162, 39, 0.2);
        box-shadow: none;
      }

      /* A dark disc under the glyph. Without it the glyph lands on the tower's stonework and the
         two fight — the mask has no outline of its own to separate them. */
      .core {
        position: absolute;
        inset: 10%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(8, 6, 13, 0.8) 0 30%,
          rgba(8, 6, 13, 0.42) 62%,
          transparent 80%
        );
      }

      /* The quest glyph — the scroll. Same recolourable CSS mask the page uses for every glyph
         (styles.css:85-102); quest.svg is a five-group Illustrator export with four groups
         display:none, and masking takes the rendered result rather than untangling its paths.
         Tall and narrow, so the box is sized past the others' to land at a comparable weight
         (`contain` fits to whichever axis binds first — here, height). */
      .glyph {
        position: relative;
        width: 150px;
        height: 196px;
        background: var(--gold-bright);
        -webkit-mask: url('../../docs/pages/media/glyphs/quest.svg') center / contain no-repeat;
        mask: url('../../docs/pages/media/glyphs/quest.svg') center / contain no-repeat;
        filter: drop-shadow(0 0 22px rgba(201, 162, 39, 0.55))
          drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6));
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="photo"></div>
      <div class="scrim"></div>
      <div class="emblem">
        <div class="halo"></div>
        <div class="track"></div>
        <div class="track inner"></div>
        <div class="core"></div>
        <span class="glyph"></span>
      </div>
    </div>
  </body>
</html>
